name: Terraform GitOps Pipeline

# Triggers: runs on every push and pull request to main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  TF_VERSION: '1.7.0'
  # Azure credentials pulled from GitHub Secrets — never hardcoded
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  # ── Job 1: Validate & Security Scan ────────────────────────────
  # Runs on every push and PR — fast feedback before anything deploys
  validate:
    name: Validate and Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Check formatting — fails if code is not properly formatted
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: task-05-gitops-pipeline/terraform

      # Download providers and connect to remote state
      - name: Terraform Init
        run: terraform init
        working-directory: task-05-gitops-pipeline/terraform

      # Validate syntax and configuration
      - name: Terraform Validate
        run: terraform validate
        working-directory: task-05-gitops-pipeline/terraform

      # tfsec — scans Terraform for security misconfigurations
      # soft_fail means findings are reported but do not block the pipeline
      # Switch to soft_fail: false once existing findings are triaged
      - name: tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

      # Checkov — checks against 1000+ compliance policy rules
      - name: Checkov Policy Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: task-05-gitops-pipeline/terraform
          soft_fail: true

  # ── Job 2: Terraform Plan ───────────────────────────────────────
  # Only runs on pushes to main — saves the plan as an artifact
  # so the apply job uses exactly what was planned
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: task-05-gitops-pipeline/terraform

      # Save the plan as a file — apply will use this exact plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: task-05-gitops-pipeline/terraform

      # Upload the plan so the apply job can download and use it
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: task-05-gitops-pipeline/terraform/tfplan

  # ── Job 3: Manual Approval Gate ────────────────────────────────
  # Pipeline pauses here — requires manual approval in GitHub
  # before anything is deployed to Azure
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    # This environment has manual approval protection configured in GitHub
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: task-05-gitops-pipeline/terraform

      # Download the exact plan that was approved
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: task-05-gitops-pipeline/terraform

      # Apply using the saved plan — not a re-plan
      # This guarantees exactly what was approved gets deployed
      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: task-05-gitops-pipeline/terraform